[project]
name = "theorematic"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pulp>=3.3.0",
    "z3-solver>=4.16.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theorematic"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
]

[tool.black]
line-length = 100
target-version = ["py313"]
